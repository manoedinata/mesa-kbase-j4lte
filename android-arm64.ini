# Meson cross file: Android 11 (API 30) arm64, NDK r21e mounted at /ndk.
[binaries]
c = '/ndk/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang'
cpp = '/ndk/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++'
ar = '/ndk/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
strip = '/ndk/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
pkg-config = 'pkg-config'
[properties]
needs_exe_wrapper = true
[built-in options]
c_args = ['-Wno-error=unknown-warning-option']
cpp_args = ['-Wno-error=unknown-warning-option']
c_link_args = ['-fuse-ld=lld']
cpp_link_args = ['-fuse-ld=lld']
[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'
